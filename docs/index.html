<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PCIL Exam Portal V2</title>
<meta name="theme-color" content="#006039">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PCIL Exam">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3F0;--card:#FFFFFF;--ink:#0E2A1E;--soft:#4E6659;--line:#D3DED7;--green:#006039;--green2:#E1EEE7;--gold:#A37E2C;--gold2:#F6EDD8;--bad:#B3261E;--bad2:#FBE6E4;--onGreen:#FFFFFF;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08170F;--card:#10261B;--ink:#E6EFE9;--soft:#9DB5A7;--line:#22402F;--green:#2FA36B;--green2:#123323;--gold:#D9B45E;--gold2:#2E2612;--bad:#F08A80;--bad2:#3A1714;--onGreen:#04140B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#08170F;--card:#10261B;--ink:#E6EFE9;--soft:#9DB5A7;--line:#22402F;--green:#2FA36B;--green2:#123323;--gold:#D9B45E;--gold2:#2E2612;--bad:#F08A80;--bad2:#3A1714;--onGreen:#04140B;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--green)}
.wrap{max-width:680px;margin:0 auto;padding:0 18px 120px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.mast{background:var(--green);color:#fff;padding:26px 22px 30px;border-radius:0 0 28px 28px;margin:0 -18px 22px}
.mast h1{margin:0;font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
.mast p{margin:8px 0 0;font-size:17px;opacity:.85}
.mast .brand{color:#E9CF8F;font-weight:700;font-size:15px;margin:0 0 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.stat{background:rgba(255,255,255,.1);border-radius:16px;padding:12px}
.stat b{display:block;font-size:28px;line-height:1.1}
.stat span{font-size:14px;opacity:.85}
h2{font-size:22px;margin:28px 0 12px;font-weight:800}
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:10px}
.tile .ic{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--green2)}
.tile b{display:block;font-size:19px}
.tile small{color:var(--soft);font-size:15px}
.tile.hero{background:var(--gold2);border-color:var(--gold)}
.tile.hero .ic{background:var(--gold);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-size:16px;font-weight:600}
/* quiz */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 10px;margin-bottom:6px}
.barrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.x{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:16px;font-weight:600}
.count{font-weight:800;font-size:18px}
.track{height:8px;background:var(--line);border-radius:8px;margin-top:10px;overflow:hidden}
.track i{display:block;height:100%;background:var(--green);border-radius:8px;transition:width .25s}
.tag{display:inline-block;font-size:14px;font-weight:700;color:var(--gold);margin:10px 0 6px}
.stem{font-size:21px;font-weight:600;line-height:1.45;margin:0 0 18px;white-space:pre-line}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;font-size:19px;line-height:1.4}
.bub{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid var(--soft);display:grid;place-items:center;font-weight:800;font-size:17px;color:var(--soft)}
.opt.right{border-color:var(--green);background:var(--green2)}
.opt.right .bub{background:var(--green);border-color:var(--green);color:var(--onGreen)}
.opt.wrong{border-color:var(--bad);background:var(--bad2)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{border-radius:16px;padding:16px 18px;margin:6px 0 10px;font-size:18px;border-left:6px solid var(--green);background:var(--card)}
.fb.no{border-left-color:var(--bad)}
.fb h3{margin:0 0 6px;font-size:20px}
.note{margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--gold2);font-size:16px}
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.dock button{display:block;width:100%;max-width:644px;margin:0 auto;background:var(--green);color:var(--onGreen);border:0;border-radius:16px;padding:17px;font-size:19px;font-weight:800}
.dock button:disabled{opacity:.35}
/* result */
.score{text-align:center;padding:30px 10px 10px}
.score .big{font-size:76px;font-weight:800;line-height:1;color:var(--green)}
.score p{color:var(--soft);margin:8px 0 0}
.rev{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;font-size:17px}
.rev .a{color:var(--green);font-weight:700;margin-top:6px}
.rev .y{color:var(--bad);font-weight:600}
/* tips */
.w{margin-bottom:14px}
.w .lab{display:flex;justify-content:space-between;font-weight:700;font-size:17px;margin-bottom:5px}
.w .t{height:22px;background:var(--line);border-radius:8px;overflow:hidden}
.w .t i{display:block;height:100%;background:var(--green)}
.w:first-child .t i{background:var(--gold)}
.steps{counter-reset:s;padding:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding:14px 16px 14px 60px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px}
.steps li::before{content:counter(s);position:absolute;left:14px;top:12px;width:32px;height:32px;border-radius:50%;background:var(--gold);color:#fff;font-weight:800;display:grid;place-items:center}
/* flash */
.card{background:var(--card);border:2px solid var(--gold);border-radius:22px;padding:28px 22px;min-height:280px;display:flex;flex-direction:column;justify-content:center;text-align:center;width:100%}
.card .f{font-size:28px;font-weight:800;line-height:1.3}
.card .b{font-size:20px;line-height:1.55;margin-top:14px}
.card .h{color:var(--soft);font-size:15px;margin-top:18px}
.pair{display:flex;gap:10px;margin-top:14px}
.pair button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;font-weight:700;font-size:17px}
.muted{color:var(--soft);font-size:16px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:22px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.zh{display:block;color:var(--soft);font-size:.9em;margin-top:4px;font-weight:500}
.stem .zh{font-size:19px;color:var(--ink);opacity:.8;margin-top:8px}
.lang{display:flex;gap:6px;margin-top:16px}
.lang button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:7px 14px;font-size:15px;font-weight:700}
.lang button[aria-pressed="true"]{background:#E9CF8F;color:#0E2A1E;border-color:#E9CF8F}
.lang.in button{background:var(--card);color:var(--ink);border-color:var(--line)}
.lang.in button[aria-pressed="true"]{background:var(--gold);color:#fff;border-color:var(--gold)}
.fb p{margin:0}.fb p+p{margin-top:6px}
.sure{background:var(--gold2);border:1px solid var(--gold);border-radius:16px;padding:14px 16px;font-size:17px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const S={Y24:["2024 PCIL Past Year","2024 历年考题"],P1:["PCIL Past Year #1","历年考题 #1"],P2:["PCIL Past Year #2","历年考题 #2"],P3:["PCIL Past Year #3","历年考题 #3"],PA:["PCEIA Part A textbook","PCEIA A 部课本"],PC:["PCEIA Part C textbook","PCEIA C 部课本"],IL:["CEILLI textbook","CEILLI 课本"],TIP:["Team tips","团队提示"]};
const T={L:["Life policy","人寿保单"],P:["Insurance principles","保险原则"],R:["Law & ethics","法律与道德"],M:["Medical & health","医疗与健康"],I:["ILP & investment","投资联结与投资"],C:["Calculation","计算题"]};
const Q=[
["P1","L","The objective of life insurance is ____.",["Make profit from insurance claims","Help insurance companies grow","To provide financial security against the uncertainty of losses","Avoid losses arising from accident"],"c","Insurance gives financial security against uncertain loss — never a way to profit."],
["P1","M","Under the Guidelines on Medical and Health Insurance Business, cost-sharing is not mandatory and, where applicable, is limited to the lower of ____ (excluding deductibles) or ____ (inclusive of deductibles) per claim.",["20%, RM3,000","20%, RM5,000","30%, RM3,000","30%, RM5,000"],"a","Remember: 20% or RM3,000, whichever is lower."],
["P1","L","Conversion from term insurance to permanent life insurance is subject to ____.",["Premium affected on attained age or original age basis","Insured continues to pay the same premium","Premium must be paid on a single premium basis","Premium rate review on conversion"],"d","Past-year key: premium rate is reviewed on conversion."],
["P1","L","A ____ is applied in almost all ordinary life contracts, with premiums constant throughout the insurance period.",["Level payment system","Level premium system","Constant premium system","Uniform payment system"],"b","Same premium every year despite rising mortality = level premium system."],
["P1","R","PIDM complements BNM’s prudential role by ____.",["Providing a safety net for depositors and policy owners in the event of insolvency","Protecting consumers against unscrupulous agents","Providing immediate resolution to complaints","Protecting insurers against financial losses"],"a","PIDM = safety net if a member institution fails."],
["P1","L","Relevant sources of information for life underwriting: I. Proposal form II. Medical examiner’s report III. Agent’s report IV. Attending physician’s statement",["I, II, III","I, II, IV","I, III, IV","I, II, III, IV"],"a","Past-year key: proposal form, medical examiner’s report and agent’s report."],
["P1","R","Prohibited business conduct: I. Persuading a consumer to conceal or make material facts ambiguous II. Offering to act for an insurer in negotiating a policy III. Misleading statement, illustration, forecast or comparison IV. Any act for an insurer on issuance/renewal of a policy",["I, II","I, III","I, IV","II, III, IV"],"b","II and IV describe what an agent normally does — not prohibited."],
["P1","L","A life insurer shall not void a life policy or refuse a claim by reason only of ____.",["Misstatement of age","Misrepresentation of condition of health","Misrepresentation of medical history","Non-disclosure of hazardous hobbies"],"a","Wrong age is corrected by adjusting premium or sum assured, not by voiding."],
["P1","L","The charge for covering the cost of mortality and interest is called ____ premium.",["Gross","Net","Risk","Written"],"b","Net = mortality + interest. Gross = net + expenses and profit loading."],
["P1","P","Pure risks are insurable ____.",["Because there is no possibility of a loss","Because of the need to maintain the principle of indemnity","Because insurers prefer good risks only","Because of the principle of utmost good faith"],"b","Past-year key: indemnity restores you to your position — no gain possible with pure risk."],
["P1","L","A regular premium policy acquires surrender value if premiums have been paid continuously for ____ years.",["2","3","4","5"],"b","Past-year answer: 3 years.","10th-edition textbook wording: a policy owner may surrender any time after inception if the policy provides a surrender value. Know both."],
["P1","L","Which of the following will NOT be charged extra premium?",["Blasters","Underground mine workers","Clerks","Deep sea divers"],"c","Clerks have no occupational hazard."],
["P1","L","The 3 types of life claims are: I. Supplementary contract claims II. Performance claims III. Death claims IV. Maturity claims",["I, II, III","I, II, IV","I, III, IV","II, III, IV"],"c","There’s no such thing as a 'performance claim'."],
["P1","L","Assignment is the mechanism to transfer the ____ of an insured to another person.",["Rights","Liabilities","Insurable interest","Rights and liabilities"],"d","Assignment transfers both rights and liabilities."],
["P1","P","What is the main reason why people buy insurance?",["To profit from claims","Worry about the effects of misfortune","To claim tax deductions","Feel obliged to the agent"],"b","People buy for peace of mind against misfortune."],
["P1","L","The policy states that the proposal and declaration shall be the basis of the contract. This section is the ____.",["Representation clause","Recital clause","Operative clause","Attestation clause"],"b","Recital clause links the proposal and declaration to the contract."],
["P1","P","Caveat emptor means ____.",["Let the seller beware","Let the buyer beware","Utmost good faith","Representation"],"b","Ordinary contracts = buyer beware. Insurance = utmost good faith instead."],
["P1","L","____ bonus is only paid on policies resulting in maturity or death claims, if kept fully in force.",["Terminal","Interim","Special","Simple"],"a","Terminal bonus = paid only at the end (maturity or death)."],
["P1","L","If there is misrepresentation of age, which measure will be taken?",["If true age is greater, vary the sum assured and bonuses in proportion to premiums paid and the true age","Policy cancelled, no refund","Policy cancelled, premiums refunded","If age understated, pay premium on true age with interest"],"a","Older than stated → sum assured is scaled down."],
["P1","I","The switching facility in ILPs enables ____.",["Insurer to switch SP plan to RP plan","Insurer to switch ILP to traditional endowment","Policy owners to switch to another insurer’s policy","Policy owners to switch part or all investment from one fund to another"],"d","Switching = moving money between funds inside the same ILP."],
["P1","R","If the group policy owner has no insurable interest in the persons insured, the insurer pays policy monies directly to ____.",["Nominee","Administrator","Insured persons","Employer"],"c","No insurable interest → money goes straight to the insured persons."],
["P1","L","Two non-forfeiture options: I. Paid-up, no further premiums, reduced sum assured II. Shorten term, full sum assured III. Paid-up but keep paying, reduced sum assured IV. Shorten term and increase sum assured",["I, II","I, III","I, IV","I, II, III"],"a","Reduced paid-up (I) or extended term (II)."],
["P1","I","Under the ILP guidelines, valuation of units shall be carried out every ____.",["Business day","Week","Business week","Day"],"a","Units are valued every business day."],
["P1","P","The schedule of a fire policy does NOT include:",["Name of insurer, period of insurance","Name and address of insured, premium","Occupation, location of property","Details of claims, conditions and procedures"],"d","Claims details and conditions sit in the policy wording, not the schedule."],
["P1","R","The agent should explain: I. Extra charges and their purpose II. Other policies with the lowest premiums in the market III. Restrictions, limitations and exclusions IV. Scope of cover, terms and conditions",["III, IV","I, II, III","I, III, IV","II, III, IV"],"c","Agents don’t need to list competitors' cheapest premiums."],
["P1","R","Which is NOT a key regulatory objective of BNM for the insurance sector?",["Foster fair, responsible, professional conduct","Watch solvency and market conduct","Promote monetary and financial stability","Protect shareholders of insurers against bankruptcy"],"d","BNM protects consumers and stability — not shareholders."],
["P1","L","When can group insurance be bought?",["Creditor on debtor’s life","Employees for their employer","Father for family members","Employer for his/her employees"],"d","Classic group insurance: employer covering employees."],
["P1","M","The term 'deductible' in health insurance refers to ____.",["Policyholder pays a pre-agreed amount first, balance paid by insurer","Agent pays a pre-agreed amount first","Insurer pays a pre-agreed amount first","Special payment arrangements"],"a","Deductible = the first portion you pay yourself."],
["P1","P","An insured is allowed to collect the full claim from insurers and then collect again from the person responsible for the ____.",["Liability","Indemnity","Good behavior","All the above"],"b","Past-year key: indemnity. (Concept tested: subrogation prevents double recovery.)"],
["P1","P","____ is the legal right to insure a legitimate financial interest in a subject matter of insurance.",["Subrogation","Contribution","Insurable interest","Utmost good faith"],"c","Legal right + financial interest = insurable interest."],
["P1","R","The customer fact-find form does NOT include:",["Customer’s risk profile","Medical history","Cash flow analysis","Life and financial priorities and goals"],"b","Medical history goes in the proposal form, not the fact-find."],
["P1","C","Amanda, 35, bought a single premium ILP with RM50,000. Two years later she topped up RM30,000. Total sum assured after the top-up is ____.",["RM50,000","RM62,500","RM80,000","RM100,000"],"b","Past-year key: RM50,000 × 125% = RM62,500. Top-up does not raise the sum assured here."],
["P1","R","A composite insurance company carries on ____.",["Both life and general insurance business","General insurance only","A single class","Life insurance only"],"a","Composite = life + general."],
["P1","P","In marine insurance, insurable interest must exist at the time of ____.",["Not required","Loss","Effecting the policy only","Inception and time of loss"],"b","Marine: at time of loss. Life: at inception. Other general: both."],
["P1","P","An insurer offers cover on different terms instead of accepting the proposal as-is. This is ____.",["Acceptance","Consideration","Consent","Counteroffer"],"d","New terms = counteroffer."],
["P1","P","Characteristics of insurable risks exclude ____.",["Illegal and against public policy","Large number of similar risks","Insurable interest","Reasonable premium"],"a","Illegal risks can never be insured."],
["P1","I","There is a ____ between expected return and risk in a rational environment.",["Reverse proportion","Correlation","Relationship","Trade off"],"d","Risk-return trade-off: higher return needs higher risk."],
["P1","I","Funds invested in particular regions or industries are ____ funds.",["Bond","Balanced","Specialized","Managed"],"c","Specific sector or region = specialized fund."],
["P1","P","Risks can be categorised as:",["Pure and fundamental","Pure and speculative","Fundamental and particular / pure and speculative","Speculative and particular"],"c","Two pairs: fundamental vs particular, pure vs speculative."],
["P1","I","Which statement is INCORRECT about unit trusts?",["They are authorised and supervised by BNM","Useful for private investors","Useful for people without enough funds or time","Give access to diversified investments"],"a","Unit trusts are not supervised by BNM — hence incorrect."],
["P1","I","Types of real estate investment do NOT include:",["Domestic property","Liquid assets","Commercial property","Agricultural property"],"b","Liquid assets aren’t real estate."],
["P1","I","What is important before any investment decision?",["Cash flow analysis","Net worth analysis","Cash flow and net worth analysis","Personal budget and cash flow"],"c","Do both: cash flow and net worth."],
["P1","I","The initial offer period of a new fund shall not exceed ____ months.",["Two","Four","Three","One"],"a","Max 2 months."],
["P1","I","Investment-linked insurance provides ____.",["Investment in properties","Investment in human life","Life coverage and investment return","Life insurance"],"c","ILP = protection + investment."],
["P1","L","A life insurer may reject or delay a claim on the basis of ____.",["Claim reported after the time limit","Non-disclosure or misrepresentation","Late submission of documents","Non-payment of claim processing fees"],"b","Only valid ground listed: non-disclosure/misrepresentation."],
["P1","L","Which is payable only on maturity or death claim?",["Policy dividend","Interim bonus","Terminal bonus","Cash bonus"],"c","Terminal bonus = only at the end."],
["P1","I","Which is guaranteed under an investment-linked policy?",["Annual investment income","Fixed value of units","Investment under property fund","The sum assured"],"d","Only the sum assured is guaranteed; unit values move."],
["P1","R","Underlying principles of the code of ethics: I. Avoid conflicts of interest II. Avoid misuse of position III. Prevent misuse of information IV. Prevent competition between agents",["I, II and III","I and IV","I, II and IV","I, II, III, IV"],"a","Preventing competition is not an ethics principle."],
["P1","R","Which statement is NOT true for implied actual authority?",["Acting in good faith and interpreting express instructions reasonably","Doing anything incidental to express instructions","Acts usually performed by persons in the agent’s position","Acts usual in a particular trade"],"a","Past-year key: (a)."],
["P1","C","Emily withdraws RM2,000 from her 10,000 units. Unit price is RM2. How many units remain?",["1,000","8,947","9,000","10,543"],"c","RM2,000 ÷ RM2 = 1,000 units. 10,000 − 1,000 = 9,000."],
["P2","L","To contest the validity of a life contract, an insurer must prove ____.",["False information","Inaccurate underwriting information","Erroneous statement of facts","Concealment of material facts"],"d","Material facts concealed = ground to contest."],
["P2","L","'Where a life contract has been in effect for more than two years… shall not be avoided… unless the statement was material and fraudulently made.' This refers to ____.",["The proviso","Suicide clause","Operative clause","Non-contestability clause"],"d","2-year rule = non-contestability."],
["P2","L","Which is NOT a method of distributing divisible surplus?",["Non-par maturity claim","Cash bonus","Guarantee bonus","Interim bonus"],"a","Non-par policies don’t share in surplus."],
["P2","L","When assets of the insurance fund exceed liabilities, there is ____.",["Liability","Surplus","Assets","Market value"],"b","Assets > liabilities = surplus."],
["P2","L","After 2 years in force, a life contract shall not be avoided on the following grounds EXCEPT ____.",["A pre-existing health condition not disclosed","A statement omitted in the medical report","A careless misrepresentation of age","A statement omitted in the proposal form"],"a","Past-year #2 key: (a).","The same question in Past Year #3 is keyed (b). Sources conflict — confirm with your trainer."],
["P2","L","On election for a paid-up policy, the policy stays in force for the full sum insured until ____.",["Policy owner surrenders","Next premium on the new policy is due","Next premium on the original policy is due","Policy owner retires"],"c","Full cover runs until the next original premium due date."],
["P2","L","What do policyholders lose if they surrender a life policy?",["Only death cover","Three quarters of savings","Half the cash value","All benefits including life protection"],"d","Surrender ends the contract — all benefits gone."],
["P2","L","The life insurer refunds overpayment to the insured ____.",["If the insurer makes more profit","If insured proves more profit","If real age is less than stated","If insured is healthier now"],"c","Younger than stated → premium was too high → refund."],
["P2","M","With additional premium, an HSI policy can be extended to these benefits EXCEPT ____.",["Organ transplant","Accidental death benefit","Cosmetic surgery","Insured child’s daily guardian allowance"],"c","Cosmetic surgery is excluded."],
["P2","M","For HSI policies not renewed or deferred, the insurer must notify the policy owner ____.",["At least 60 days after anniversary","At least 30 days before expiry","At least 60 days upon expiry","At least 30 days before the policy anniversary date"],"d","30 days before anniversary."],
["P2","M","Which is NOT a benefit limitation in medical and health coverage?",["Reducing benefit payable","Shortening disability income period","Larger deductible","Option to reduce coverage at the time of a claim"],"d","Benefit limitations are set at underwriting, not chosen at claim."],
["P2","R","If the group policy owner has no ____ in the persons insured, the insurer must give each insured person details of cover, rights and obligations.",["Utmost good faith","Insurable interest","Contractual capacity","Personal interest"],"b","No insurable interest → insurer informs insured persons directly."],
["P2","M","MHI in Malaysia is written by both life and general insurers as a ____.",["Stand-alone policy","Rider to a life policy","Supplementary cover","Health benefit package"],"a","Past-year key: stand-alone policy."],
["P2","M","An important underwriting factor for a medical and health proposal:",["Age","Hobbies","Marital status","Education level"],"a","Age drives health risk."],
["P2","M","____ mainly cater for employer healthcare benefits, part of remuneration.",["Group PA","Group term life","Group retirement savings","Group medical and health insurance"],"d","Employer healthcare = group medical."],

  <h2 style="margin-top:18px">${bi("Read all Q&A","题目答案一览")}</h2>
  <div class="chips">${srcs.map(chip).join("")}</div>
  <div class="chips" style="margin-top:10px"><button class="chip" onclick="rd.hide=!rd.hide;readAll()" style="${rd.hide?"background:var(--gold);color:#fff;border-color:var(--gold)":""}">${rd.hide?bi("Answers hidden — tap to show all","答案已隐藏 — 点击全部显示"):bi("Hide answers (test myself)","隐藏答案(自我测试)")}</button></div>
  <input class="ra-search" type="search" placeholder="${esc(plain("Search a word, e.g. free-look","搜索关键词,例如 冷静期"))}" oninput="raFilter(this.value)">
  <div id="ra" class="${rd.hide?"hide":""}" style="margin-top:14px">${list.map(item).join("")}</div>
  <p class="muted" id="ra-none" hidden>${bi("No questions match.","没有符合的题目。")}</p>
  <div class="dock"><button onclick="window.scrollTo({top:0,behavior:'smooth'})">↑ ${plain("Back to top","回到顶部")}</button></div>`;
}
function raFilter(v){v=v.trim().toLowerCase();let n=0;document.querySelectorAll("#ra .qa").forEach(e=>{const s=!v||e.dataset.t.includes(v);e.hidden=!s;if(s)n++});document.getElementById("ra-none").hidden=n>0}
let hi=0;
function hot(i){
  const n=HOT.length;hi=((i%n)+n)%n;cur=()=>hot(hi);const h=HOT[hi];window.scrollTo(0,0);
  const body=st.lang==="en"?esc(h[1]):st.lang==="zh"?esc(h[2]):esc(h[1])+`<span class="zh" style="margin-top:12px">${esc(h[2])}</span>`;
  app.innerHTML=`<div class="bar"><div class="barrow"><button class="x" onclick="home()">← ${bi("Home","主页")}</button><span class="count">${hi+1} / ${n}</span></div></div>${langBar("in")}
  <button class="card" style="margin-top:12px" onclick="this.querySelector('.b').hidden=false;this.querySelector('.h').hidden=true"><div class="f">${esc(h[0])}</div><div class="b" hidden>${body}</div><div class="h">${bi("Tap to show answer","点击显示答案")}</div></button>
  <div class="pair"><button onclick="hot(${hi-1})">← ${bi("Previous","上一张")}</button><button onclick="hot(${hi+1})">${bi("Next","下一张")} →</button></div>`;
}
home();
</script>
</body>
</html>
